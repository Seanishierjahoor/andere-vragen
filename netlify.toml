[[redirects]]
  from = "/perspective.html"
  to = "/praktijk.html"
  status = 301

[[redirects]]
  from = "/method"
  to = "/praktijk.html"
  status = 301

[[redirects]]
  from = "/method.html"
  to = "/praktijk.html"
  status = 301

