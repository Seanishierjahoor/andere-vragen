# Sinds de pivot (sept 2026) is Samenkomsten de voorpagina. De oude pagina's zijn op 30 okt 2026 weggehaald;
# een onbekend adres toont 404.html. De oude site staat in git: tag `launch-sept-2026`.

[[redirects]]
  from = "/"
  to = "/samenkomsten.html"
  status = 200
  force = true

[[redirects]]
  from = "/en"
  to = "/gatherings.html"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 302
  force = true

# Kaartbestanden van Op doortocht hebben een versie in de url (?v=...): die mogen lang in de cache.
[[headers]]
  for = "/beeld/kaart/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Paden hieronder zijn relatief aan de base directory.
[build]
  base = "deploy-69b57ddb7678231067f42b2f"
  publish = "."
  functions = "netlify/functions"
  # Zonder build command slaat Netlify de build-stap over en worden functies nooit gebundeld.
  command = "npm install --prefix netlify/functions"

[functions]
  node_bundler = "esbuild"
